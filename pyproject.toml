[project]
name = "entirius-django-atlas"
version = "2.0.0"
description = "Generic external-product-data ingestion engine (procurement/monitoring/enrichment) for Volkanos"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "lxml>=5.0",
    "requests>=2.31",
    "celery>=5.3",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-pim>=3.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "factory-boy", "dj-database-url", "psycopg[binary]"]
qms  = ["entirius-django-qms>=4.0.0"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-atlas"

[project.entry-points."atlas_connectors"]
xml_feed = "django_atlas.connectors.xml_feed:XmlFeedConnector"
scraper = "django_atlas.connectors.scraper:ScraperConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_atlas"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["django_atlas"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
